<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Built for 1099 contractors and the self-employed: The Ledger sets aside your tax % as each payment lands, smooths your lumpy income into a steady paycheck, and shows your real number after tax. It can see your money; it can't move it — you confirm every move in your own bank. Calibrated overdraft odds, subscription-creep alerts, and a quarterly tax estimate."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <script>
      // Set the saved theme before the first paint so it doesn't flash.
      // Paper (light) ledger by default; "dark" is the midnight vault.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
    <title>The Ledger — taxes & cash flow for 1099 contractors</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
