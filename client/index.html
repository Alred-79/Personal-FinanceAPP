<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ledger-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Know what is safe to spend, what could derail it, and how a decision changes the outcome. The Ledger combines your accounts, bills, income, goals, and modeled cash-flow risk without moving money behind your back."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <script>
      // Set the saved theme before the first paint so it doesn't flash.
      // Paper (light) ledger by default; "dark" is the midnight vault.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
    <title>The Ledger — know what’s safe to spend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
