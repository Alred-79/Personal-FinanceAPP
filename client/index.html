<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Ledger brings your accounts, bills, income, and goals together so you can see what is safe to spend, test what happens next, and keep every assumption close enough to inspect."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <script>
      // Set the saved theme before the first paint so it doesn't flash.
      // Paper (light) ledger by default; "dark" is the midnight vault.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
    <title>The Ledger — know what is safe to spend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
