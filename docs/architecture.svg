<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#0f9d6e"/>
    </marker>
    <style>
      .ink{fill:#1b2733}
      .muted{fill:#64748b}
      .surf{fill:#ffffff;stroke:#d6deea;stroke-width:1.5;rx:12}
      .lane{fill:#f7f9fc;stroke:#e6ecf3;stroke-width:1.5}
      .title{font-weight:700}
      .h{font-weight:700;font-size:15px;fill:#1b2733}
      .sub{font-size:12px;fill:#64748b}
      .ext{fill:#f1f5f9;stroke:#dbe3ec;stroke-width:1.5}
      .pill{fill:#eef2f7;stroke:#dbe3ec;stroke-width:1}
      .pilltxt{font-size:11px;fill:#475569;font-weight:600}
      .gpill{fill:#ecfaf4;stroke:#9be0c6;stroke-width:1}
      .gpilltxt{font-size:11px;fill:#0a7d57;font-weight:700}
      .flow{stroke:#94a3b8;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .flowG{stroke:#0f9d6e;stroke-width:2;fill:none;marker-end:url(#arrowG)}
    </style>
  </defs>

  <!-- header -->
  <text x="40" y="42" class="ink title" font-size="22">Finance Tracker — system architecture</text>
  <text x="40" y="64" class="muted" font-size="13">A budgeting app with two intelligent surfaces and one carefully guarded path to your data.</text>

  <!-- ============ CLIENTS ============ -->
  <text x="40" y="104" class="muted" font-size="11" letter-spacing="1.5">CLIENTS</text>
  <rect class="surf" x="40" y="114" width="300" height="76" rx="12" filter="url(#shadow)"/>
  <text x="62" y="146" class="h">Web app</text>
  <text x="62" y="167" class="sub">React 18 · TypeScript · Zustand · Vite</text>
  <text x="62" y="183" class="sub">axios client with refresh-queue interceptor</text>

  <rect class="surf" x="372" y="114" width="320" height="76" rx="12" filter="url(#shadow)"/>
  <text x="394" y="146" class="h">AI agent</text>
  <text x="394" y="167" class="sub">External MCP client (Claude, etc.)</text>
  <text x="394" y="183" class="sub">authenticates with a scoped MCP key</text>

  <!-- ============ APPLICATION CONTAINER ============ -->
  <rect class="lane" x="40" y="226" width="652" height="392" rx="16"/>
  <text x="60" y="252" class="muted" font-size="11" letter-spacing="1.5">FASTAPI APPLICATION</text>

  <!-- surfaces row -->
  <rect class="surf" x="60" y="266" width="190" height="96" rx="12" filter="url(#shadow)"/>
  <text x="78" y="294" class="h">REST API</text>
  <text x="78" y="315" class="sub">19 routers</text>
  <text x="78" y="332" class="sub">JWT auth + refresh</text>
  <text x="78" y="349" class="sub">routers → services</text>

  <rect class="surf" x="266" y="266" width="190" height="96" rx="12" filter="url(#shadow)"/>
  <text x="284" y="294" class="h">AI assistant</text>
  <text x="284" y="315" class="sub">LangChain agent</text>
  <text x="284" y="332" class="sub">SSE token stream</text>
  <text x="284" y="349" class="sub">confirm-then-write</text>

  <!-- MCP secured surface highlighted -->
  <rect x="472" y="266" width="200" height="96" rx="12" fill="#ecfaf4" stroke="#0f9d6e" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="294" class="h" fill="#0a7d57">MCP vault</text>
  <text x="490" y="315" class="sub" fill="#0a7d57">capability token</text>
  <text x="490" y="332" class="sub" fill="#0a7d57">scope gate → redact</text>
  <text x="490" y="349" class="sub" fill="#0a7d57">audit every read</text>

  <!-- shared service / read layer -->
  <rect class="surf" x="60" y="402" width="612" height="64" rx="12" filter="url(#shadow)"/>
  <text x="78" y="430" class="h">Domain services + shared read-query layer</text>
  <text x="78" y="451" class="sub">money handled as integer cents · category canonicalization · single source of truth</text>

  <!-- data layer -->
  <rect class="surf" x="60" y="500" width="380" height="88" rx="12" filter="url(#shadow)"/>
  <text x="78" y="530" class="h">Persistence</text>
  <text x="78" y="552" class="sub">SQLAlchemy ORM</text>
  <text x="78" y="570" class="sub">9 Alembic migrations (versioned schema)</text>

  <rect class="ext" x="456" y="500" width="216" height="88" rx="12" filter="url(#shadow)"/>
  <text x="474" y="530" class="h">SQLite</text>
  <text x="474" y="552" class="sub">used_action_tokens</text>
  <text x="474" y="570" class="sub">UNIQUE(jti) → replay-proof</text>

  <!-- ============ EXTERNAL ============ -->
  <text x="740" y="252" class="muted" font-size="11" letter-spacing="1.5">EXTERNAL</text>
  <rect class="ext" x="740" y="266" width="200" height="60" rx="12" filter="url(#shadow)"/>
  <text x="760" y="293" class="h">Plaid</text>
  <text x="760" y="312" class="sub">bank sync (sandbox)</text>

  <rect class="ext" x="740" y="338" width="200" height="60" rx="12" filter="url(#shadow)"/>
  <text x="760" y="365" class="h">Groq LLM</text>
  <text x="760" y="384" class="sub">assistant + categorization</text>

  <rect class="ext" x="740" y="410" width="200" height="60" rx="12" filter="url(#shadow)"/>
  <text x="760" y="437" class="h">Tavily web</text>
  <text x="760" y="456" class="sub">SSRF-guarded fetch</text>

  <!-- ============ FLOWS ============ -->
  <!-- clients to surfaces -->
  <path class="flow" d="M190,190 L155,266"/>
  <path class="flowG" d="M560,190 L572,266"/>
  <path class="flow" d="M470,190 C430,220 380,238 361,266"/>

  <!-- surfaces to shared layer -->
  <path class="flow" d="M155,362 L200,402"/>
  <path class="flow" d="M361,362 L361,402"/>
  <path class="flowG" d="M572,362 L520,402"/>

  <!-- shared layer to persistence -->
  <path class="flow" d="M250,466 L250,500"/>
  <path class="flow" d="M250,544 L456,544" />

  <!-- externals -->
  <path class="flow" d="M250,300 C420,310 600,300 740,300" opacity="0.5"/>
  <path class="flow" d="M456,330 C560,350 660,362 740,366"/>
  <path class="flow" d="M456,348 C540,420 650,438 740,440"/>

  <!-- ============ ANNOTATION PILLS ============ -->
  <g>
    <rect class="pill" x="266" y="218" width="120" height="22" rx="11"/>
    <text x="276" y="233" class="pilltxt">single-use tokens</text>
  </g>
  <g>
    <rect class="gpill" x="472" y="218" width="200" height="22" rx="11"/>
    <text x="482" y="233" class="gpilltxt">sole DB door · AST guard in CI</text>
  </g>

  <!-- security boundary callout -->
  <rect x="708" y="486" width="232" height="118" rx="12" fill="#fbfdfc" stroke="#9be0c6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="724" y="510" class="gpilltxt" font-size="12">Why the MCP path is safe</text>
  <text x="724" y="532" class="sub" font-size="11">JWT type isolation blocks</text>
  <text x="724" y="547" class="sub" font-size="11">token confusion. Scopes can</text>
  <text x="724" y="562" class="sub" font-size="11">only narrow, never escalate.</text>
  <text x="724" y="577" class="sub" font-size="11">Sessions are read-only and</text>
  <text x="724" y="592" class="sub" font-size="11">always rolled back.</text>
</svg>
